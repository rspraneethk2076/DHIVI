<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Clinical AI topic illustration</title>
  <desc id="desc">Abstract clinical ai illustration used as a clearly labeled topic image when a publisher has no article thumbnail.</desc>
  <defs>
    <radialGradient id="ambient" cx=".57" cy=".48" r=".72"><stop stop-color="#122a28"/><stop offset=".52" stop-color="#101919"/><stop offset="1" stop-color="#070b0b"/></radialGradient>
