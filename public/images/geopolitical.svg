    <ellipse cx="600" cy="250" rx="109" ry="150"/>
    <ellipse cx="600" cy="250" rx="150" ry="55"/>
    <ellipse cx="600" cy="190" rx="138" ry="43"/>
    <ellipse cx="600" cy="310" rx="138" ry="43"/>
    <path d="M450 250H750M600 100V400"/>
  </g>
  <path d="M600 100A150 150 0 0 0 450 250M450 250A150 55 0 0 0 682 296M600 100A52 150 0 0 1 640 344" stroke="url(#light)" stroke-width="1.5"/>
  <path d="M348 171C394 99 477 103 513 170M687 170C757 114 831 151 855 292M510 332C465 390 400 364 365 312" stroke="#b6d9be" stroke-opacity=".17" stroke-dasharray="4 7"/>
  <path d="M380 171H423L468 216H517M822 292H778L732 246H684M389 312H441L474 279H558" stroke="#aed9cb" stroke-opacity=".38"/>
