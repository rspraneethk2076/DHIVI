  <path d="M517 216L623 329M583 164L558 279M558 279L684 246" stroke="#9ad8d0" stroke-opacity=".2"/>

  <g transform="translate(347 171)"><use href="#chipNode"/></g>
  <g transform="translate(855 292)"><use href="#chipNode"/></g>
  <g transform="translate(356 312) scale(.76)"><use href="#chipNode"/></g>
  <g fill="#d5fda6">
    <circle cx="517" cy="216" r="4"/><circle cx="583" cy="164" r="4"/><circle cx="684" cy="246" r="4"/>
    <circle cx="623" cy="329" r="4"/><circle cx="558" cy="279" r="4"/>
  </g>
  <g stroke="#d5fda6" stroke-opacity=".3">
    <circle cx="517" cy="216" r="9"/><circle cx="684" cy="246" r="9"/><circle cx="623" cy="329" r="9"/>
  </g>
  <path d="M600 49V72M600 428V451M397 250H420M780 250H803" stroke="#9ad8d0" stroke-opacity=".35"/>
  <circle cx="658" cy="89" r="3" fill="#c3f56b" fill-opacity=".7"/>
  <circle cx="542" cy="411" r="3" fill="#9ad8d0" fill-opacity=".6"/>
  <path d="M38 48H62M50 36V60M1138 452H1162M1150 440V464" stroke="#c3f56b" stroke-opacity=".4"/>
</svg>

