<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Geopolitical AI topic illustration</title>
  <desc id="desc">An abstract globe of meridians connected to chip nodes. This is a schematic topic illustration, without national borders or geographic claims, used when a publisher has no article thumbnail.</desc>
  <defs>
    <radialGradient id="ambient" cx=".54" cy=".48" r=".72"><stop stop-color="#152b24"/><stop offset=".52" stop-color="#101919"/><stop offset="1" stop-color="#070b0b"/></radialGradient>
    <radialGradient id="sphere" cx=".38" cy=".32" r=".75"><stop stop-color="#20382e" stop-opacity=".55"/><stop offset=".6" stop-color="#10211c"/><stop offset="1" stop-color="#08120f"/></radialGradient>
    <linearGradient id="metal" x1="300" y1="60" x2="850" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#34423c"/><stop offset=".36" stop-color="#192522"/><stop offset="1" stop-color="#0b1211"/></linearGradient>
    <linearGradient id="light" x1="450" y1="100" x2="760" y2="390" gradientUnits="userSpaceOnUse"><stop stop-color="#ecffdb"/><stop offset=".46" stop-color="#c3f56b"/><stop offset="1" stop-color="#9ad8d0" stop-opacity=".2"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#a5cbb7" stroke-opacity=".045"/></pattern>
    <pattern id="dots" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#cadacf" fill-opacity=".2"/></pattern>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="globeClip"><circle cx="600" cy="250" r="150"/></clipPath>
    <g id="chipNode">
      <path d="M-33-15H-25M-33 0H-25M-33 15H-25M25-15H33M25 0H33M25 15H33M-15-33V-25M0-33V-25M15-33V-25M-15 25V33M0 25V33M15 25V33" stroke="#b4d7ac" stroke-opacity=".65" stroke-width="2"/>
      <rect x="-25" y="-25" width="50" height="50" rx="5" fill="#0a1310" stroke="#b4d7ac" stroke-opacity=".55"/>
      <rect x="-21" y="-21" width="42" height="42" rx="3" fill="url(#metal)" stroke="#577660" stroke-opacity=".55"/>
      <rect x="-12" y="-12" width="24" height="24" rx="1" fill="#c3f56b" fill-opacity=".1" stroke="#c3f56b" stroke-opacity=".7"/>
      <path d="M-7-8V8M0-8V8M7-8V8M-8-7H8M-8 0H8M-8 7H8" stroke="#c3f56b" stroke-opacity=".25" stroke-width=".75"/>
      <path d="M-25-15V-25H-15" stroke="#e4ffcf" stroke-opacity=".9"/>
    </g>
  </defs>
  <rect width="1200" height="500" fill="url(#ambient)"/>
  <rect width="1200" height="500" fill="url(#grid)"/>
  <rect width="1200" height="500" fill="url(#dots)"/>
  <path d="M0 80H205L260 135H365M0 420H185L245 360H365M1200 120H1025L970 175H880M1200 400H1040L985 345H885" stroke="#c3f56b" stroke-opacity=".14"/>
  <g fill="#c3f56b" opacity=".45"><circle cx="260" cy="135" r="3"/><circle cx="245" cy="360" r="3"/><circle cx="970" cy="175" r="3"/><circle cx="985" cy="345" r="3"/></g>

  <ellipse cx="600" cy="405" rx="221" ry="22" fill="#000" opacity=".58" filter="url(#shadow)"/>
  <circle cx="600" cy="250" r="186" stroke="#b8e6c7" stroke-opacity=".06"/>
  <circle cx="600" cy="250" r="171" stroke="#a7cfb6" stroke-opacity=".14" stroke-dasharray="1 8"/>
  <path d="M439 195A171 171 0 0 1 658 89M761 305A171 171 0 0 1 542 411" stroke="#a7cfb6" stroke-opacity=".32"/>
  <circle cx="600" cy="250" r="150" fill="url(#sphere)" stroke="#a9d5b9" stroke-opacity=".5"/>
